<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 764" role="img" aria-labelledby="title desc">
<title id="title">filename 사진과 영상 처리 흐름</title>
<desc id="desc">폴더에서 이미 처리한 파일을 제외한다. 사진은 크기를 조정하고 영상은 세 시점의 프레임을 추출해 부족한 프레임을 보충한다. 로컬 Gemma 분석과 JSON 검사를 거쳐 사용자가 태그와 근거를 검토한 후 파일명을 변경하고 이력을 기록한다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8ab4f8"/></marker></defs>
<rect width="640" height="764" rx="16" fill="#0d1117"/>
<g fill="none" stroke="#8ab4f8" stroke-width="2.5" marker-end="url(#arrow)">
<path d="M320 112 V142 H177 V168"/><path d="M320 112 V142 H463 V168"/>
<path d="M177 296 V322 H320 V348"/><path d="M463 296 V322 H320" marker-end="none"/>
<path d="M320 420 V450"/><path d="M320 522 V552"/><path d="M320 624 V654"/>
</g>
<rect x="88" y="24" width="464" height="88" rx="12" fill="#161b22" stroke="#526273" stroke-width="1.5"/>
<text x="320.0" y="52.0" text-anchor="middle" dominant-baseline="middle" fill="#e6edf3" font-size="25" font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif">폴더 선택</text>
<text x="320.0" y="84.0" text-anchor="middle" dominant-baseline="middle" fill="#e6edf3" font-size="22" font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif">처리된 파일은 건너뛰기</text>
<rect x="46" y="168" width="262" height="128" rx="12" fill="#161b22" stroke="#526273" stroke-width="1.5"/>
<text x="177.0" y="216.0" text-anchor="middle" dominant-baseline="middle" fill="#e6edf3" font-size="25" font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif">사진</text>
<text x="177.0" y="248.0" text-anchor="middle" dominant-baseline="middle" fill="#e6edf3" font-size="22" font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif">이미지 크기 조정</text>
<rect x="332" y="168" width="262" height="128" rx="12" fill="#161b22" stroke="#526273" stroke-width="1.5"/>
<text x="463.0" y="200.0" text-anchor="middle" dominant-baseline="middle" fill="#e6edf3" font-size="25" font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif">영상</text>
<text x="463.0" y="232.0" text-anchor="middle" dominant-baseline="middle" fill="#e6edf3" font-size="22" font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif">20% · 50% · 80%</text>
<text x="463.0" y="264.0" text-anchor="middle" dominant-baseline="middle" fill="#e6edf3" font-size="22" font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif">필요한 프레임 보충</text>
<rect x="88" y="348" width="464" height="72" rx="12" fill="#16352e" stroke="#71cdb1" stroke-width="1.5"/>
<text x="320.0" y="384.0" text-anchor="middle" dominant-baseline="middle" fill="#a1e4cf" font-size="25" font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif">로컬 Gemma 모델 분석</text>
<rect x="88" y="450" width="464" height="72" rx="12" fill="#161b22" stroke="#526273" stroke-width="1.5"/>
<text x="320.0" y="486.0" text-anchor="middle" dominant-baseline="middle" fill="#e6edf3" font-size="25" font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif">JSON 파싱과 출력 규칙 검사</text>
<rect x="88" y="552" width="464" height="72" rx="12" fill="#161b22" stroke="#526273" stroke-width="1.5"/>
<text x="320.0" y="588.0" text-anchor="middle" dominant-baseline="middle" fill="#e6edf3" font-size="25" font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif">태그와 관찰 근거를 사용자 검토</text>
<rect x="88" y="654" width="464" height="86" rx="12" fill="#16352e" stroke="#71cdb1" stroke-width="1.5"/>
<text x="320.0" y="681.0" text-anchor="middle" dominant-baseline="middle" fill="#a1e4cf" font-size="25" font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif">검토한 파일명 적용</text>
<text x="320.0" y="713.0" text-anchor="middle" dominant-baseline="middle" fill="#a1e4cf" font-size="22" font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif">변경 이력 기록</text>
</svg>
